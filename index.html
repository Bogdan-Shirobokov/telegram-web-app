<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игры</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      padding: 20px;
    }
    h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .screen { display: none; }
    .active { display: block; }
    .game-button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .game-button:hover {
      background-color: #0056b3;
    }

    /* Стили для крестиков-ноликов */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }
    .cell {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      background-color: #fff;
      border: 2px solid #ccc;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .cell:hover {
      background-color: #e0e0e0;
    }
    .message {
      margin-top: 20px;
      font-size: 24px;
      color: #555;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    select {
      margin-top: 15px;
      padding: 10px;
      font-size: 18px;
    }

    /* Стили для RPS */
    #rps-game button {
      margin: 10px;
      padding: 10px 20px;
    }
    #rps-result {
      margin-top: 20px;
      font-size: 24px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Игровое меню</h1>

  <div id="main-menu" class="screen active">
    <h2>Выберите игру:</h2>
    <button class="game-button" onclick="showTicTacToe()">Крестики-нолики</button>
    <button class="game-button" onclick="showRPSGame()">Камень, ножницы, бумага</button>
  </div>

  <div id="tictactoe" class="screen">
    <h1>Игра "Крестики-нолики"</h1>
    <label for="difficulty">Выберите уровень сложности:</label>
    <select id="difficulty">
      <option value="easy">Легкий</option>
      <option value="medium">Средний</option>
      <option value="hard">Сложный</option>
    </select>

    <div class="grid" id="grid">
      <div class="cell" id="cell-0" onclick="makeMove(0)"></div>
      <div class="cell" id="cell-1" onclick="makeMove(1)"></div>
      <div class="cell" id="cell-2" onclick="makeMove(2)"></div>
      <div class="cell" id="cell-3" onclick="makeMove(3)"></div>
      <div class="cell" id="cell-4" onclick="makeMove(4)"></div>
      <div class="cell" id="cell-5" onclick="makeMove(5)"></div>
      <div class="cell" id="cell-6" onclick="makeMove(6)"></div>
      <div class="cell" id="cell-7" onclick="makeMove(7)"></div>
      <div class="cell" id="cell-8" onclick="makeMove(8)"></div>
    </div>

    <div class="message" id="message">Ход X</div>

    <button onclick="resetGame()">Начать заново</button>
    <button onclick="sendResults()">Отправить результат боту</button>
    <button onclick="showMainMenu()">Вернуться в меню</button>
  </div>

  <div id="rps-game" class="screen">
    <h1>Камень, ножницы, бумага</h1>
    <p>Выберите ваш ход:</p>
    <button onclick="playRPS('rock')">Камень</button>
    <button onclick="playRPS('paper')">Бумага</button>
    <button onclick="playRPS('scissors')">Ножницы</button>
    <div id="rps-result"></div>
    <button onclick="showMainMenu()">Вернуться в меню</button>
  </div>

  <script>
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let opponent = 'O';

    const winConditions = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function showMainMenu() {
      document.getElementById('main-menu').classList.add('active');
      document.getElementById('tictactoe').classList.remove('active');
      document.getElementById('rps-game').classList.remove('active');
    }

    function showTicTacToe() {
      document.getElementById('main-menu').classList.remove('active');
      document.getElementById('tictactoe').classList.add('active');
      document.getElementById('rps-game').classList.remove('active');
    }

    function showRPSGame() {
      document.getElementById('main-menu').classList.remove('active');
      document.getElementById('tictactoe').classList.remove('active');
      document.getElementById('rps-game').classList.add('active');
    }

    function makeMove(index) {
      if (board[index] === '' && gameActive) {
        board[index] = currentPlayer;
        document.getElementById(`cell-${index}`).textContent = currentPlayer;
        checkWinner();
        if (gameActive && currentPlayer === 'X') {
          currentPlayer = 'O';
          document.getElementById('message').textContent = `Ход ${currentPlayer}`;
          setTimeout(makeAIMove, 500);
        }
      }
    }

    function checkWinner() {
      for (let i = 0; i < winConditions.length; i++) {
        const [a, b, c] = winConditions[i];
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          document.getElementById('message').textContent = `Победил ${board[a]}!`;
          gameActive = false;
          highlightWinningCells(a, b, c);
          return;
        }
      }

      if (!board.includes('')) {
        document.getElementById('message').textContent = 'Ничья!';
        gameActive = false;
      }
    }

    function highlightWinningCells(a, b, c) {
      document.getElementById(`cell-${a}`).style.backgroundColor = '#00ff00';
      document.getElementById(`cell-${b}`).style.backgroundColor = '#00ff00';
      document.getElementById(`cell-${c}`).style.backgroundColor = '#00ff00';
    }

    function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;
      document.getElementById('message').textContent = 'Ход X';
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById(`cell-${i}`);
        cell.textContent = '';
        cell.style.backgroundColor = '#fff';
      }
    }

    function sendResults() {
      let result = document.getElementById('message').textContent;
      Telegram.WebApp.sendData(result);
    }

    function makeAIMove() {
      const difficulty = document.getElementById('difficulty').value;
      let move;
      
      if (difficulty === 'easy') {
        move = getRandomMove();
      } else if (difficulty === 'medium') {
        move = getMediumMove();
      } else {
        move = getBestMove();
      }

      if (move !== undefined && board[move] === '') {
        board[move] = opponent;
        document.getElementById(`cell-${move}`).textContent = opponent;
        checkWinner();
        currentPlayer = 'X';
        if (gameActive) {
          document.getElementById('message').textContent = `Ход ${currentPlayer}`;
        }
      }
    }

    function getRandomMove() {
      const emptyCells = board.map((cell, index) => cell === '' ? index : null).filter(index => index !== null);
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function getMediumMove() {
      for (let i = 0; i < winConditions.length; i++) {
        const [a, b, c] = winConditions[i];
        if (board[a] === 'X' && board[b] === 'X' && board[c] === '') return c;
        if (board[a] === 'X' && board[c] === 'X' && board[b] === '') return b;
        if (board[b] === 'X' && board[c] === 'X' && board[a] === '') return a;
      }
      return getRandomMove();
    }

    function getBestMove() {
      const bestMove = minimax(board, opponent);
      return bestMove.index;
    }

    function minimax(newBoard, player) {
      const availSpots = newBoard.map((cell, index) => cell === '' ? index : null).filter(index => index !== null);
      if (checkWin(newBoard, 'X')) return { score: -10 };
      if (checkWin(newBoard, 'O')) return { score: 10 };
      if (availSpots.length === 0) return { score: 0 };

      const moves = [];
      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;
        if (player === 'O') {
          const result = minimax(newBoard, 'X');
          move.score = result.score;
        } else {
          const result = minimax(newBoard, 'O');
          move.score = result.score;
        }
        newBoard[availSpots[i]] = '';
        moves.push(move);
      }

      let bestMove;
      if (player === 'O') {
        let bestScore = -10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = 10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }
      return moves[bestMove];
    }

    function checkWin(board, player) {
      for (let i = 0; i < winConditions.length; i++) {
        const [a, b, c] = winConditions[i];
        if (board[a] === player && board[b] === player && board[c] === player) return true;
      }
      return false;
    }

    // Логика RPS
    function playRPS(move) {
      // Ходы: rock/paper/scissors
      const aiMoves = ['rock', 'paper', 'scissors'];
      const aiMove = aiMoves[Math.floor(Math.random() * 3)];

      let resultText;
      if (move === aiMove) {
        resultText = `Ничья! Вы оба выбрали ${translateMove(move)}.`;
      } else if (
        (move === 'rock' && aiMove === 'scissors') ||
        (move === 'paper' && aiMove === 'rock') ||
        (move === 'scissors' && aiMove === 'paper')
      ) {
        resultText = `Вы выиграли! Вы выбрали ${translateMove(move)}, AI выбрал ${translateMove(aiMove)}.`;
        // Отправим результат боту
        Telegram.WebApp.sendData("RPS Win");
      } else {
        resultText = `Вы проиграли! Вы выбрали ${translateMove(move)}, AI выбрал ${translateMove(aiMove)}.`;
      }

      document.getElementById('rps-result').textContent = resultText;
    }

    function translateMove(move) {
      if (move === 'rock') return 'Камень';
      if (move === 'paper') return 'Бумага';
      if (move === 'scissors') return 'Ножницы';
    }

    window.addEventListener('load', () => {
      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.ready();
      }
    });
  </script>
</body>
</html>
